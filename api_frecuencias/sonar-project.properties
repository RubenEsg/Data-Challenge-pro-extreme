# Análisis estático con SonarQube / SonarScanner (spec v1.5, §7.1 y RNF-013).
# Uso, con un servidor SonarQube propio o SonarCloud (el token va en la variable SONAR_TOKEN, nunca aquí):
#   pytest --cov=app --cov-report=xml:docs/evidencias/coverage.xml --junitxml=docs/evidencias/pytest.xml
#   ruff check app tests --output-format json > docs/evidencias/ruff.json
#   bandit -r app -f json -o docs/evidencias/bandit.json
#   sonar-scanner -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN
# Mientras no haya servidor, la evidencia de calidad son los reportes de ruff, bandit y pytest-cov (carpeta docs/evidencias/).

sonar.projectKey=sobusa-api-frecuencias
sonar.projectName=API de frecuencias · Data Challenge Sobusa 2026
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

sonar.sources=app
sonar.tests=tests
sonar.exclusions=**/__pycache__/**,**/.venv/**,**/migrations/versions/**,**/alembic/versions/**
sonar.test.inclusions=tests/**/*.py

sonar.python.version=3.11
sonar.python.coverage.reportPaths=docs/evidencias/coverage.xml
sonar.python.xunit.reportPath=docs/evidencias/pytest.xml
sonar.python.ruff.reportPaths=docs/evidencias/ruff.json
sonar.python.bandit.reportPaths=docs/evidencias/bandit.json

# Las migraciones de Alembic se generan con plantilla; se excluyen de la detección de duplicados
sonar.cpd.exclusions=**/alembic/**,**/migrations/**

# La puerta de calidad exigida por el reto: sin vulnerabilidades ni hallazgos críticos o bloqueantes
sonar.qualitygate.wait=true
