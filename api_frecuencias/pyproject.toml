[project]
name = "api-frecuencias-sobusa"
version = "1.0.0"
description = "API de frecuencias Sobusa: backend del reto (FastAPI + PostgreSQL, esquema ai_frecuencias)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Abrahan Basto Martínez" },
    { name = "Rubén Esguerra Fernández" },
    { name = "Paula Gómez" },
]
license = { text = "Uso académico - Universidad del Norte" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]
# niveles de §14.1; las de Testcontainers solo corren con TESTCONTAINERS=1 (CI y scripts/ci_local.py)
markers = [
    "integracion: repositorios, migraciones y API contra PostgreSQL",
    "testcontainers: PostgreSQL/PostGIS efímero con Testcontainers (TESTCONTAINERS=1)",
    "contrato: contrato OpenAPI (esquemas, códigos, autenticación y compatibilidad)",
    "datos_ml: distribución de variables, no regresión del modelo y fuga temporal",
]

[tool.coverage.run]
# todo app/, también el motor D5 (tests/unit/test_motor_d5.py y test_optimizacion.py lo ejercitan)
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv", "app/servicios/motor_d5"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["B008", "S101", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"alembic/versions/*" = ["E501"]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
