# Análisis estático con SonarQube / SonarScanner (spec v1.5: §7.1, RNF-007, RNF-013, §14.2 y reporte de E03).
#
# Forma recomendada (servidor SonarQube local en Docker, perfil y puerta «Reto Sobusa v1.5», evidencia completa):
#   .venv/Scripts/python.exe scripts/sonar_local.py --archivo-clave <ruta FUERA del repositorio>/sonar_admin.txt
# El script corre pytest con cobertura, ruff y bandit, ejecuta sonar-scanner-cli y escribe docs/evidencias/sonarqube/
# (puerta, medidas, hallazgos, hotspots, resumen.md y captura del tablero) y docs/evidencias/calidad/ (ruff y bandit).
#
# Con un servidor propio o en CI (el token va en la variable SONAR_TOKEN, nunca aquí):
#   sonar-scanner -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.token=$SONAR_TOKEN
# Las rutas de los reportes de abajo son las que deja scripts/sonar_local.py; en CI se pasan con -D a reportes/.

sonar.projectKey=sobusa-api-frecuencias
sonar.projectName=API de frecuencias · Data Challenge Sobusa 2026
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

sonar.sources=app
sonar.tests=tests
sonar.exclusions=**/__pycache__/**,**/.venv/**,**/migrations/versions/**,**/alembic/versions/**
sonar.test.inclusions=tests/**/*.py

sonar.python.version=3.11,3.13
# Cobertura de TODO app/ (también app/servicios/motor_d5/) y junit de la última corrida completa
sonar.python.coverage.reportPaths=docs/evidencias/sonarqube/coverage.xml
sonar.python.xunit.reportPath=docs/evidencias/sonarqube/pytest.xml
sonar.python.ruff.reportPaths=docs/evidencias/calidad/ruff.json
sonar.python.bandit.reportPaths=docs/evidencias/calidad/bandit.json

# Las migraciones de Alembic se generan con plantilla; se excluyen de la detección de duplicados
sonar.cpd.exclusions=**/alembic/**,**/migrations/**

# La puerta de calidad exigida por el reto: sin vulnerabilidades ni hallazgos críticos o bloqueantes
sonar.qualitygate.wait=true
